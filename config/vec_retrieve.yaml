embed_model: nomic-embed-text
chunk_size: 500
chunk_overlap: 80
top_k: 5   

RAG_PRODUCTION_SYSTEM/
│
├── config/                          # Configuration files (models, retrieval params)
│   ├── llm.yaml                     # Model selection, temperature, token limits
│   └── retriever.yaml               # Top-k, similarity thresholds, search strategy
│
├── data/                            # Knowledge base and document storage
│   ├── raw/                         # Original source documents (PDFs, URLs, raw text)
│   ├── processed/                   # Cleaned and chunked documents ready for embedding
│   └── vectordb/                    # Local or cached vector database indexes
│
├── src/                             # Core application source code
│   ├── ingestion/                   # Document loaders and parsers
│   ├── chunking/                    # Text splitting and chunk boundary logic
│   ├── embeddings/                  # Embedding model wrappers (OpenAI, HuggingFace, etc.)
│   ├── vectordb/                    # Vector store connectors (Chroma, Pinecone, FAISS)
│   ├── retrieval/                   # Similarity search and reranking logic
│   ├── prompts/                     # Versioned prompt templates
│   ├── generation/                  # LLM client and response builder
│   └── api/                         # FastAPI / Flask routes and endpoints
│
├── evaluation/                      # RAG metrics and benchmarking
│   ├── retrieval_eval.py            # Hit rate, MRR, NDCG metrics
│   └── answer_eval.py               # Faithfulness and relevancy scores
│
├── scripts/                         # Automation and CLI entrypoints
│   ├── ingest_documents.sh          # Full data ingestion pipeline script
│   ├── build_index.py               # Vector DB index builder
│   └── run_eval.py                  # Automated evaluation suite runner
│
├── .env                             # Environment variables and API keys
├── Dockerfile                       # Container configuration
└── requirements.txt                 # Project dependencies
